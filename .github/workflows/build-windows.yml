name: Compilar Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activar suporte Windows
        run: flutter config --enable-windows-desktop

      - name: Gerar a pasta windows
        run: flutter create --platforms=windows --project-name rh_lider .

      - name: Remover teste de exemplo gerado automaticamente
        shell: pwsh
        run: if (Test-Path test) { Remove-Item -Recurse -Force test }

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar o codigo
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Compilar em modo release
        run: flutter build windows --release

      - name: Incluir as bibliotecas do Visual C++ na aplicacao
        shell: pwsh
        run: |
          $dest = "build\windows\x64\runner\Release\"
          $dllNames = @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll")
          $found = @{}

          # 1ª tentativa: System32, onde o runner ja tem o VC++ Redistributable instalado
          foreach ($name in $dllNames) {
            $sysPath = Join-Path "$env:WINDIR\System32" $name
            if (Test-Path $sysPath) {
              Copy-Item -Path $sysPath -Destination $dest -Force
              $found[$name] = $true
              Write-Host "Copiado do System32: $sysPath"
            }
          }

          # 2ª tentativa (fallback): procurar em qualquer instalacao do Visual Studio no runner
          $missing = $dllNames | Where-Object { -not $found[$_] }
          if ($missing.Count -gt 0) {
            Write-Host "Nao encontradas no System32, a procurar em instalacoes do Visual Studio: $missing"
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            if (Test-Path $vswhere) {
              $vsPaths = & $vswhere -products * -legacy -prerelease -property installationPath
              foreach ($vsPath in $vsPaths) {
                foreach ($name in $missing) {
                  if ($found[$name]) { continue }
                  $hit = Get-ChildItem -Path $vsPath -Recurse -Filter $name -ErrorAction SilentlyContinue |
                    Select-Object -First 1 -ExpandProperty FullName
                  if ($hit) {
                    Copy-Item -Path $hit -Destination $dest -Force
                    $found[$name] = $true
                    Write-Host "Copiado de instalacao VS: $hit"
                  }
                }
              }
            }
          }

          $stillMissing = $dllNames | Where-Object { -not $found[$_] }
          if ($stillMissing.Count -gt 0) {
            Write-Error "Nao foi possivel localizar estas DLLs: $stillMissing"
            exit 1
          }

          Get-ChildItem "$dest*.dll" | Select-Object Name

      - name: Instalar o Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Criar o instalador
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss'

      - name: Publicar o instalador
        uses: actions/upload-artifact@v4
        with:
          name: RH-Lider-Setup
          path: installer\installer_output\RH-Lider-Setup.exe
          retention-days: 30
