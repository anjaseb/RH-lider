name: Compilar Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Obter o codigo
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activar suporte Windows
        run: flutter config --enable-windows-desktop

      - name: Gerar a pasta windows (se ainda nao existir)
        run: flutter create --platforms=windows .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar o codigo
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Compilar em modo release
        run: flutter build windows --release

      - name: Preparar pacote
        run: |
          mkdir dist
          xcopy /E /I /Y build\windows\x64\runner\Release dist\RHLider
          powershell Compress-Archive -Path dist\RHLider\* -DestinationPath RH-Lider-Windows.zip

      - name: Publicar o executavel
        uses: actions/upload-artifact@v4
        with:
          name: RH-Lider-Windows
          path: RH-Lider-Windows.zip
          retention-days: 30
